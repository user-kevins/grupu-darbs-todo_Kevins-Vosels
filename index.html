<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Mani darbi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">

            <h3 class="text-center mb-4">Todo List V3</h3>

            <div class="input-group mb-3">
                <select id="priority" class="form-select" style="max-width: 120px;">
                    <option value="bg-danger">Svarīgi</option>
                    <option value="bg-warning text-dark">Vidēji</option>
                    <option value="bg-secondary">Zema</option>
                </select>

                <input type="text" id="task-input" class="form-control" placeholder="Ieraksti darbu...">

                <button class="btn btn-primary" onclick="addTask()">Pievienot</button>
            </div>

            <!-- Meklēšana -->
            <input type="text" id="search-input" class="form-control mb-3" placeholder="Meklēt uzdevumu...">

            <!-- Filtri -->
            <div class="btn-group mb-3 w-100">
                <button class="btn btn-outline-primary active" onclick="setFilter('all', this)">Visi</button>
                <button class="btn btn-outline-primary" onclick="setFilter('active', this)">Aktīvie</button>
                <button class="btn btn-outline-primary" onclick="setFilter('done', this)">Pabeigtie</button>
            </div>

            <ul id="task-list" class="list-group mb-3"></ul>

            <!-- Statistika -->
            <div class="d-flex justify-content-between align-items-center">
                <span id="stats">Atlikuši 0 darbi</span>
                <button class="btn btn-danger btn-sm" onclick="clearCompleted()">Notīrīt pabeigtos</button>
            </div>

        </div>
    </div>
</div>

<script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    const taskList = document.getElementById("task-list");
    const taskInput = document.getElementById("task-input");
    const priorityInput = document.getElementById("priority");
    const searchInput = document.getElementById("search-input");
    const stats = document.getElementById("stats");

    let currentFilter = "all";

    renderTasks();

    searchInput.addEventListener("input", renderTasks);

    function addTask() {
        const text = taskInput.value.trim();
        if (text === "") return;

        const selectedOption = priorityInput.options[priorityInput.selectedIndex];

        const taskObj = {
            text: text,
            color: selectedOption.value,
            label: selectedOption.text,
            done: false
        };

        tasks.push(taskObj);
        saveAndRender();

        taskInput.value = "";
    }

    function saveAndRender() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
        renderTasks();
    }

    function setFilter(filter, button) {
        currentFilter = filter;

        document.querySelectorAll(".btn-group button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        renderTasks();
    }

    function renderTasks() {
        taskList.innerHTML = "";

        const searchText = searchInput.value.toLowerCase();

        tasks.forEach((task, index) => {

            if (task.text.toLowerCase().includes(searchText) === false) return;

            if (currentFilter === "active" && task.done) return;
            if (currentFilter === "done" && !task.done) return;

            createTaskElement(task, index);
        });

        updateStats();
    }

    function createTaskElement(task, index) {

        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        li.innerHTML = `
            <div class="d-flex align-items-center">
                <span class="badge ${task.color} me-2 p-2">${task.label}</span>
                <span class="task-text ${task.done ? 'text-decoration-line-through' : ''}">
                    ${task.text}
                </span>
            </div>

            <div>
                <button class="btn btn-outline-info btn-sm me-1">Labot</button>
                <button class="btn btn-outline-danger btn-sm">Dzēst</button>
            </div>
        `;

        li.querySelector(".task-text").onclick = function () {
            task.done = !task.done;
            saveAndRender();
        };

        li.querySelector(".btn-outline-danger").onclick = function () {
            tasks.splice(index, 1);
            saveAndRender();
        };

        li.querySelector(".btn-outline-info").onclick = function () {
            editTask(index);
        };

        taskList.appendChild(li);
    }

    function editTask(index) {
        const newText = prompt("Ievadi jauno uzdevuma tekstu:", tasks[index].text);

        if (newText === null) return;

        const cleanText = newText.trim();

        if (cleanText === "") return;

        tasks[index].text = cleanText;

        saveAndRender();
    }

    function updateStats() {
        const left = tasks.filter(task => !task.done).length;
        stats.textContent = "Atlikuši " + left + " darbi";
    }

    function clearCompleted() {
        tasks = tasks.filter(task => !task.done);
        saveAndRender();
    }

</script>

</body>
</html>
